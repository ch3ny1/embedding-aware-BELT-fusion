# AlignFormer per-agent late-fusion detector.
#
# A machine-local copy of OpenCOOD's
# external/OpenCOOD/opencood/hypes_yaml/point_pillar_late_fusion.yaml with
# `root_dir` / `validate_dir` pointed at this machine's OPV2V paths, plus a
# `detector.checkpoint` key (not part of OpenCOOD's own schema) so later
# AlignFormer tasks have one place to find the trained weights.
#
# No late-fusion checkpoint survived on this machine, and OpenCOOD's
# published one is unreachable on both mirrors it ships (Google Drive file
# deleted, UCLA Box requires an interactive/OAuth session) -- see
# .superpowers/sdd/2026-09-17-alignformer-p0-p2/task-2-report.md. This
# config is trained from scratch by scripts/train_late_fusion.py, which
# shims OpenCOOD's ASCII .pcd loader to read a pre-built binary cache so the
# ~1 day estimate for this yaml drops to a few hours on this machine's USB
# spinning disk. Do not point `root_dir`/`validate_dir` at raw OPV2V paths
# for training here without that shim.
name: point_pillar_late_fusion

# Scenario-level 85/15 train/val split of OPV2V train/, materialized as
# symlink directories by scripts/train_late_fusion.py:build_scenario_split
# (OPV2V/train/validate on this machine: validate/ is a broken symlink, so
# validation is a held-out slice of train/, split by scenario -- never by
# frame, to avoid near-duplicate leakage -- with the same seed as the
# CoLoca-QuA baseline's split_scenarios(..., val_fraction=0.15, seed=0)).
root_dir: "outputs/alignformer/opv2v_splits/train"
validate_dir: "outputs/alignformer/opv2v_splits/val"

yaml_parser: "load_point_pillar_params"
train_params:
  batch_size: &batch_size 2
  epoches: 15
  eval_freq: 1
  save_freq: 1

fusion:
  core_method: 'LateFusionDataset' # LateFusionDataset, EarlyFusionDataset, IntermediateFusionDataset supported
  args: []

# preprocess-related
preprocess:
  # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4]
    max_points_per_voxel: 32
    max_voxel_train: 16000
    max_voxel_test: 40000
  # lidar range for each individual cav.
  cav_lidar_range: &cav_lidar [-70.4, -40, -3, 70.4, 40, 1]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: [ 'x' ]

  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [ -0.78539816, 0.78539816 ]

  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [ 0.95, 1.05 ]

# anchor box related
postprocess:
  core_method: 'VoxelPostprocessor' # VoxelPostprocessor, BevPostprocessor supported
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: [0, 90]
    num: &achor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
  order: 'hwl' # hwl or lwh
  max_num: 100 # maximum number of objects in a single frame. use this number to make sure different frames has the same dimension in the same batch
  nms_thresh: 0.15

# model related
model:
  core_method: point_pillar
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *achor_num
    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]
    point_pillar_scatter:
      num_features: 64

    base_bev_backbone:
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]

    anchor_num: *achor_num

loss:
  core_method: point_pillar_loss
  args:
    cls_weight: 1.0
    reg: 2.0

optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep #step, multistep and Exponential support
  gamma: 0.1
  step_size: [10, 15]

# --- AlignFormer-specific (not part of OpenCOOD's hypes schema) ---
# Task 3 loads the per-agent detector from this path. Trained by
# scripts/train_late_fusion.py (finished all 15 epochs; see
# .superpowers/sdd/2026-09-17-alignformer-p0-p2/task-2-report.md for the
# full per-epoch validation loss curve). net_epoch14.pth (epoch index 13,
# 0-indexed) has the lowest validation loss of all 15 checkpoints
# (0.354794), just below the final epoch's 0.356513 -- the multistep LR
# scheduler decays at epoch 10 and validation loss plateaus/oscillates
# afterward rather than climbing, so this is a real (if small) minimum
# rather than a sign of overfitting past it.
detector:
  checkpoint: "/media/chenyi/Elements1/Repos/embedding-aware-BELT-fusion/outputs/alignformer/point_pillar_late_fusion/net_epoch14.pth"
