# AlignFormer on OPV2V, on the +/-140.8 m detector.
#
# Identical to configs/alignformer.yaml -- same model, same training schedule,
# same scenario-disjoint split (seed 0) and the same 70 m communication range
# -- except for `data.cache_root`. The ROI cache MUST be separate: the pooled
# features come from `embedding.rotated_roi_align`, which maps each box's world
# coordinates into normalized BEV grid coordinates using `lidar_range`, so a
# cache built at +/-70.4 m decodes to different features at +/-140.8 m. Pinned
# by tests/test_alignformer_range.py::test_roi_features_depend_on_the_lidar_range.
#
# The detector that fills that cache is configs/alignformer_detector_r140.yaml.
#
# Late-fusion cooperative perception that is robust to CAV localization error:
# each agent transmits boxes plus a lightweight per-object embedding, the ego
# matches the two object sets, recovers the sender's SE(2) pose error, and
# corrects the boxes before fusing. The defaults below are §3.5 of
# docs/superpowers/specs/2026-09-17-alignformer-design.md, carried verbatim.
#
# This is NOT an OpenCOOD hypes file. The per-agent detector (and the
# preprocess/postprocess blocks it needs) lives in configs/alignformer_detector.yaml;
# its detections and ROI features are baked into the cache named under `data`
# below, so nothing here touches OpenCOOD at training time.

# THE DEPLOYED ARM IS NOT THIS FILE'S DEFAULTS. As with `mode` below, the
# switches that select the shipped estimator are per-run flags, and they are
# left at their original values here so every earlier r140 number reproduces
# bit for bit from this config. The arm that task 24 shipped is:
#
#   --variance-weighting scalar
#   --robust-solve huber --robust-iterations 2 --robust-min-evidence 3.0
#   --abstain-arm per_pair
#
# on outputs/alignformer/r140/stage2_B_matched_boxes_only/best.pth -- the
# BOXES-ONLY trunk. The 128-d embedding was retired after the test run of
# 2026-09-29 (docs/alignformer_p2.md, "The message"): through this pipeline
# the two trunks are within +/-0.005 AP of each other on both splits with no
# stable sign, and the embedding was 8,034 of the 8,474 bytes per frame per
# agent. The message is now byte-for-byte FreeAlign's. The embedding trunk
# (stage2_B_ivw_scalar/best.pth) remains the reference for every earlier
# r140 number; `embed_dim` below is still needed to load that checkpoint.
# Running the plain `--metric noisy_ap` command with no flags gives the
# ORIGINAL arm, not the shipped one; docs/alignformer_p2.md quotes the full
# invocation. Note that `--abstain-arm per_pair` deliberately takes NO
# `--shrinkage`: the per-pair rule replaces the global-tau calibration rather
# than stacking on it (alignformer.noisy_fusion.unshrunk_conditions).

model:
  output_size: 4          # rotated ROI-align grid, k x k
  embed_dim: 128          # ablated over 32 / 64 / 128
  model_dim: 256
  layers: 4
  heads: 4
  heading_lambda: 2.0     # metres, about half a vehicle length
  sinkhorn_iterations: 20
  max_objects: 64
  # Inverse-variance weighting of the correspondences entering the Procrustes
  # fit (src/.../alignformer/variance.py). The parameters are DATA: they are
  # fitted on the scenario-disjoint validation slice under the true pose
  # projection by scripts/fit_correspondence_variance.py, and recorded in
  # outputs/alignformer/r140/correspondence_variance_result.json. `mode` is the
  # experimental switch and is overridden per run by
  # `--variance-weighting {none,scalar,split}`; `none` here keeps this file
  # reproducing the unweighted estimator every earlier r140 number was measured
  # under.
  #
  #   v_t(s)   = (0.2516 m   * (s / 0.4)^-1.1281)^2   per detection, 2-D
  #   v_psi(s) = (4.6392 deg * (s / 0.4)^-1.9322)^2   per detection, scalar
  #
  # Confidence, not range, is the variable the data implicates: over 63,988
  # validation correspondences the confidence form improves the Gamma deviance
  # by 0.129 (centre) / 0.438 (heading) against a homoscedastic fit, a range
  # form by 0.020 / 0.020, and adding range on top of confidence by nothing at
  # all (its fitted range scale runs to 1.7e4 m and 6.8e5 m).
  correspondence_variance:
    mode: none
    sigma_translation_m: 0.2516
    translation_exponent: 1.1281
    sigma_yaw_deg: 4.6392
    yaw_exponent: 1.9322
    score_reference: 0.4

train:
  # Stage 1 trains the embedding head and trunk on the matching loss alone, at
  # low noise; stage 2 then trains a pose head on the full noise curriculum
  # with the embedding frozen (spec §4).
  stage1_epochs: 20
  stage1_max_xy_std: 0.5  # matching is learned at low noise first
  stage2_epochs: 30
  max_xy_std: 2.0         # stage-2 curriculum ramps 0 -> this
  batch_size: 32
  lr: 1.0e-3
  match_weight: 1.0
  seed: 0

data:
  # OPV2V split roots. Only the frame yamls are read here, to build the
  # ego-CAV pair index; the point clouds are never touched at training time.
  # Each split's cached detections live under `cache_root/<split dir name>`.
  train_root: /media/chenyi/Elements1/Dataset/OPV2V/train
  test_root: /media/chenyi/Elements1/Dataset/OPV2V/test
  # Built by `python -m embedding_aware_belt_fusion.alignformer.cache`; holds
  # one npz per agent-frame with decoded boxes, scores, gt ids and ROI features.
  cache_root: /media/chenyi/basement2/cache/alignformer_r140
  # Pair index cache (coloca/index.py), keyed by (root_dir, comm_range_m) in
  # both the filename and the signature, so this 70 m index and the
  # CoLoca-QuA baseline's 40 m one coexist instead of evicting each other.
  pair_cache_dir: outputs/coloca/cache
  # OPV2V ships no usable `validate` split on this machine (broken symlink), so
  # a held-out slice of the train scenarios is used instead. Split is by
  # scenario, never by frame, to avoid near-duplicate leakage. Same fraction and
  # seed as the CoLoca-QuA baseline and as the late-fusion detector's own split,
  # so the validation scenarios below were never seen by the detector either.
  val_scenario_fraction: 0.15
  split_seed: 0
  # MUST equal opencood.data_utils.datasets.COM_RANGE, which is what
  # LateFusionDataset admits and therefore what the fused-AP evaluation
  # actually contains. Built at 40 m (CoLoca-QuA's paper value) this index hid
  # 35.8% of the training pairs while 33.8% of the evaluated pairs were out of
  # distribution by construction; see docs/alignformer_pose_floor.md section 6.
  # tests/test_alignformer_train.py pins the two together.
  comm_range_m: 70.0
